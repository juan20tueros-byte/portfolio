Description: A fun math quiz game for elementary students. It features two levels of difficulty,

and mobile-friendly layout.

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz Game</title>

    <style>
        /* General styles */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #f3e8ff);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #4338ca;
            margin-bottom: 15px;
        }

        h2 {
            color: #1e293b;
            font-size: 2rem;
            margin: 25px 0;
        }

        p {
            font-size: 1.1rem;
        }

        /* Buttons */
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 13px 18px;
            margin: 8px 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #3730a3;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
            transform: none;
        }

        /* Answer input */
        input {
            width: 100%;
            max-width: 250px;
            padding: 14px;
            font-size: 1.2rem;
            border: 2px solid #c7d2fe;
            border-radius: 10px;
            text-align: center;
            margin: 10px 0;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        /* Game area */
        #game {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 15px;
        }

        /* Feedback */
        #feedback {
            font-weight: bold;
            min-height: 30px;
            margin-top: 15px;
        }

        .correct {
            color: #15803d;
        }

        .incorrect {
            color: #dc2626;
        }

        /* Score */
        .score-box {
            background: #eef2ff;
            padding: 12px;
            border-radius: 10px;
            font-size: 1.2rem;
            margin-top: 20px;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.7rem;
            }

            h2 {
                font-size: 1.6rem;
            }

            button {
                width: 100%;
                margin: 8px 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🧮 Fun Math Quiz Game 🎉</h1>

        <p>Select a difficulty level to start:</p>

        <button onclick="startGame('easy')">
            Easy (Addition)
        </button>

        <button onclick="startGame('hard')">
            Challenging (Addition & Multiplication)
        </button>

        <!-- Game Section -->
        <div id="game" style="display: none;">

            <h2 id="question"></h2>

            <input
                type="number"
                id="answer"
                placeholder="Enter answer"
            >

            <button id="submitButton" onclick="checkAnswer()">
                Submit
            </button>

            <p id="feedback"></p>

            <button onclick="newProblem()">
                New Problem
            </button>

            <div class="score-box">
                Score: <span id="score">0</span>
            </div>

        </div>

    </div>

    <script>
        // Game variables
        let score = 0;
        let correctAnswer = 0;
        let difficulty = "easy";
        let answered = false;

        // Start the game
        function startGame(level) {
            difficulty = level;
            score = 0;
            answered = false;

            document.getElementById("score").textContent = score;
            document.getElementById("game").style.display = "block";
            document.getElementById("feedback").textContent = "";

            newProblem();
        }

        // Generate a new math problem
        function newProblem() {
            let num1;
            let num2;
            let operator;

            answered = false;

            // Easy level: addition only
            if (difficulty === "easy") {
                num1 = Math.floor(Math.random() * 20) + 1;
                num2 = Math.floor(Math.random() * 20) + 1;
                operator = "+";

                correctAnswer = num1 + num2;
            }

            // Challenging level: addition or multiplication
            else {
                const operations = ["+", "×"];
                operator = operations[Math.floor(Math.random() * operations.length)];

                if (operator === "+") {
                    num1 = Math.floor(Math.random() * 50) + 1;
                    num2 = Math.floor(Math.random() * 50) + 1;
                    correctAnswer = num1 + num2;
                } else {
                    num1 = Math.floor(Math.random() * 12) + 1;
                    num2 = Math.floor(Math.random() * 12) + 1;
                    correctAnswer = num1 * num2;
                }
            }

            // Display the question
            document.getElementById("question").textContent =
                num1 + " " + operator + " " + num2 + " = ?";

            // Reset input and feedback
            document.getElementById("answer").value = "";
            document.getElementById("feedback").textContent = "";
            document.getElementById("feedback").className = "";

            // Enable submit button
            document.getElementById("submitButton").disabled = false;

            // Focus on answer input
            document.getElementById("answer").focus();
        }

        // Check the answer
        function checkAnswer() {
            const input = document.getElementById("answer");
            const feedback = document.getElementById("feedback");
            const userAnswer = Number(input.value);

            // Prevent empty answers
            if (input.value === "") {
                feedback.textContent = "Please enter an answer!";
                feedback.className = "incorrect";
                return;
            }

            // Prevent answering the same question more than once
            if (answered) {
                feedback.textContent = "Click New Problem to continue!";
                return;
            }

            answered = true;

            if (userAnswer === correctAnswer) {
                score++;

                document.getElementById("score").textContent = score;

                feedback.textContent = "🎉 Correct! Great job!";
                feedback.className = "correct";

                playSound(true);
            } else {
                feedback.textContent =
                    "❌ Incorrect! The correct answer is " + correctAnswer + ".";

                feedback.className = "incorrect";

                playSound(false);
            }

            // Disable submit after answering
            document.getElementById("submitButton").disabled = true;
        }

        // Generate sound effects using the browser
        function playSound(isCorrect) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();

                oscillator.connect(gain);
                gain.connect(audioContext.destination);

                if (isCorrect) {
                    oscillator.frequency.value = 800;
                    oscillator.type = "sine";
                } else {
                    oscillator.frequency.value = 200;
                    oscillator.type = "triangle";
                }

                gain.gain.setValueAtTime(0.15, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    audioContext.currentTime + 0.3
                );

                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.3);

                oscillator.onended = function() {
                    audioContext.close();
                };

            } catch (error) {
                // Game continues even if sound is unavailable
            }
        }

        // Allow Enter key to submit answer
        document.getElementById("answer").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });
    </script>

</body>
</html>
